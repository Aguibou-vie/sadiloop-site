  <text x="120" y="920" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#CCCCCC">Talent Scouting &amp; Development</text>
  <text x="70" y="960" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="20" fill="#333333">02</text>
  <text x="120" y="960" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#CCCCCC">International Placement</text>
  <text x="70" y="1000" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="20" fill="#333333">03</text>
  <text x="120" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#CCCCCC">Professional Management</text>

  <!-- player section -->
  <text x="70" y="1120" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="#F5A623">OUR ATHLETES</text>
  <text x="70" y="1170" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF">THE <tspan fill="#F5A623">PLAYERS</tspan></text>

  <rect x="70" y="1210" width="460" height="560" rx="4" fill="#141414"/>
  <rect x="70" y="1580" width="460" height="190" fill="rgba(0,0,0,0.85)"/>
  <text x="102" y="1660" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF">KHALIFA DIOP</text>
  <rect x="102" y="1680" width="110" height="26" rx="4" fill="rgba(245,166,35,0.15)" stroke="#F5A623"/>
  <text x="112" y="1697" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#F5A623">SENEGALESE</text>
  <rect x="222" y="1680" width="90" height="26" rx="4" fill="none" stroke="#444444"/>
  <text x="232" y="1697" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#CCCCCC">CENTER</text>
  <text x="102" y="1740" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">Cleveland Cavaliers</text>
  <text x="102" y="1758" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#888888">NBA</text>

  <rect x="560" y="1210" width="574" height="560" rx="4" fill="#141414" stroke="rgba(245,166,35,0.15)"/>
  <text x="847" y="1500" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555" text-anchor="middle">+ Nouveaux joueurs</text>
