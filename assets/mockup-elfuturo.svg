<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <radialGradient id="efGlow" cx="80%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="efBall" cx="35%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#C8840A"/>
    </radialGradient>
    <clipPath id="efScreen">
      <rect x="0" y="46" width="1200" height="674"/>
    </clipPath>
  </defs>

  <!-- browser frame -->
  <rect width="1200" height="720" rx="18" fill="#E5E5EA"/>
  <rect x="0" y="0" width="1200" height="46" rx="18" fill="#F0F0F3"/>
  <rect x="0" y="28" width="1200" height="18" fill="#F0F0F3"/>
  <circle cx="28" cy="23" r="7" fill="#FF5F57"/>
  <circle cx="52" cy="23" r="7" fill="#FEBC2E"/>
  <circle cx="76" cy="23" r="7" fill="#28C840"/>
  <rect x="420" y="10" width="360" height="26" rx="13" fill="#FFFFFF"/>
  <text x="600" y="27" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A99" text-anchor="middle">elfuturotalent.com</text>

  <g clip-path="url(#efScreen)">
    <rect x="0" y="46" width="1200" height="674" fill="#000000"/>
    <rect x="0" y="46" width="1200" height="674" fill="url(#efGlow)"/>

    <!-- nav -->
    <rect x="0" y="46" width="1200" height="60" fill="#000000"/>
    <text x="48" y="86" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">EL <tspan fill="#F5A623">FUTURO</tspan></text>
    <text x="820" y="84" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5" fill="#CCCCCC">HOME   PLAYERS   NEWS   CONTACT</text>

    <!-- hero title -->
    <text x="70" y="250" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="70" fill="#FFFFFF">EL</text>
    <text x="70" y="330" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="70" fill="#F5A623">FUTURO</text>
    <text x="72" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#AAAAAA">African Next Generation Basketball</text>

    <!-- ball mark -->
    <g transform="translate(880,150)">
      <circle cx="120" cy="120" r="140" fill="none" stroke="rgba(245,166,35,0.15)" stroke-width="1"/>
      <circle cx="120" cy="120" r="95" fill="none" stroke="rgba(245,166,35,0.2)" stroke-width="1" stroke-dasharray="4 4"/>
      <circle cx="120" cy="120" r="64" fill="url(#efBall)"/>
      <line x1="76" y1="152" x2="146" y2="82" stroke="#FFF3D6" stroke-width="9" stroke-linecap="round"/>
      <polygon points="164,68 148,100 128,80" fill="#FFF3D6"/>
    </g>
  </g>
</svg>
