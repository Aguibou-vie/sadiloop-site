<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="msHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <clipPath id="msScreen">
      <rect x="0" y="46" width="1200" height="674" rx="0"/>
    </clipPath>
  </defs>

  <!-- browser frame -->
  <rect width="1200" height="720" rx="18" fill="#E5E5EA"/>
  <rect x="0" y="0" width="1200" height="46" rx="18" fill="#F0F0F3"/>
  <rect x="0" y="28" width="1200" height="18" fill="#F0F0F3"/>
  <circle cx="28" cy="23" r="7" fill="#FF5F57"/>
  <circle cx="52" cy="23" r="7" fill="#FEBC2E"/>
  <circle cx="76" cy="23" r="7" fill="#28C840"/>
  <rect x="420" y="10" width="360" height="26" rx="13" fill="#FFFFFF"/>
  <text x="600" y="27" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A99" text-anchor="middle">mangaspace.app</text>

  <g clip-path="url(#msScreen)">
    <rect x="0" y="46" width="1200" height="674" fill="#FAFAFA"/>

    <!-- nav -->
    <rect x="0" y="46" width="1200" height="64" fill="#FFFFFF"/>
    <rect x="0" y="110" width="1200" height="1" fill="#EEEEEE"/>
    <text x="48" y="88" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="22" fill="#7c3aed">MangaSpace</text>
    <rect x="920" y="66" width="220" height="28" rx="14" fill="#F2F2F5"/>

    <!-- hero banner -->
    <rect x="48" y="142" width="1104" height="160" rx="24" fill="url(#msHero)"/>
    <text x="88" y="210" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF">Bienvenue sur MangaSpace</text>
    <text x="88" y="248" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="rgba(255,255,255,0.9)">Le repaire des fans d'anime et de manga.</text>
    <circle cx="1080" cy="180" r="6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="1110" cy="220" r="4" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="1050" cy="250" r="5" fill="#FFFFFF" opacity="0.7"/>

    <!-- post card 1 -->
    <rect x="48" y="330" width="1104" height="150" rx="18" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
    <circle cx="96" cy="374" r="20" fill="#EDE4FF"/>
    <rect x="130" y="364" width="140" height="12" rx="6" fill="#3A3A45"/>
    <rect x="130" y="384" width="90" height="9" rx="4" fill="#C4C4CF"/>
    <rect x="80" y="410" width="1000" height="10" rx="5" fill="#E5E5EA"/>
    <rect x="80" y="428" width="820" height="10" rx="5" fill="#E5E5EA"/>
    <rect x="80" y="454" width="60" height="16" rx="8" fill="#FDE8EE"/>
    <rect x="150" y="454" width="60" height="16" rx="8" fill="#F2F2F5"/>

    <!-- post card 2 -->
    <rect x="48" y="500" width="1104" height="150" rx="18" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
    <circle cx="96" cy="544" r="20" fill="#FDE4F0"/>
    <rect x="130" y="534" width="160" height="12" rx="6" fill="#3A3A45"/>
    <rect x="130" y="554" width="90" height="9" rx="4" fill="#C4C4CF"/>
    <rect x="80" y="580" width="950" height="10" rx="5" fill="#E5E5EA"/>
    <rect x="80" y="598" width="700" height="10" rx="5" fill="#E5E5EA"/>
    <rect x="80" y="624" width="60" height="16" rx="8" fill="#FDE8EE"/>
    <rect x="150" y="624" width="60" height="16" rx="8" fill="#F2F2F5"/>
  </g>
</svg>
